<svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#22d3ee"/>
    <stop offset="100%" stop-color="#3b82f6"/>
  </linearGradient>
</defs>
<style>
  .card-bg { fill:#04101f; stroke:#0ea5e9; stroke-opacity:0.35; }
  .title { font-family: 'Segoe UI', Arial; font-size:16px; font-weight:700; fill:#e0f2fe; }
  .label { font-family: 'Segoe UI', Arial; font-size:12px; fill:#93c5fd; }
  .val { font-family: 'Segoe UI', Arial; font-size:12px; fill:#22d3ee; font-weight:700; }

  .ring { stroke-dasharray: 251; stroke-dashoffset: 251; animation: ringFill 1.8s ease-out forwards; animation-delay:0.2s; transform-origin: 90px 100px; transform: rotate(-90deg); }
  @keyframes ringFill { to { stroke-dashoffset: 40; } }

  .row-bar { transform-origin: left; transform: scaleX(0); animation: barIn 1.4s ease-out forwards; }
  @keyframes barIn { to { transform: scaleX(1); } }
</style>

<rect x="1" y="1" width="478" height="198" rx="12" class="card-bg"/>
<text x="24" y="34" class="title">GitHub Stats Overview</text>

<circle cx="90" cy="100" r="40" fill="none" stroke="#0d2b4e" stroke-width="10"/>
<circle cx="90" cy="100" r="40" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round" class="ring"/>
<text x="90" y="94" text-anchor="middle" class="title" font-size="18">A+</text>
<text x="90" y="112" text-anchor="middle" class="label" font-size="10">Rank</text>

<g transform="translate(160,64)">
  <text x="0" y="0" class="label">Total Stars</text>
  <text x="290" y="0" text-anchor="end" class="val">5</text>
  <rect x="0" y="8" width="290" height="6" rx="3" fill="#0d2b4e"/>
  <rect x="0" y="8" width="150" height="6" rx="3" fill="url(#ringGrad)" class="row-bar" style="animation-delay:0.3s"/>

  <text x="0" y="36" class="label">Total Commits</text>
  <text x="290" y="36" text-anchor="end" class="val">210+</text>
  <rect x="0" y="44" width="290" height="6" rx="3" fill="#0d2b4e"/>
  <rect x="0" y="44" width="230" height="6" rx="3" fill="url(#ringGrad)" class="row-bar" style="animation-delay:0.5s"/>

  <text x="0" y="72" class="label">Public Repos</text>
  <text x="290" y="72" text-anchor="end" class="val">8</text>
  <rect x="0" y="80" width="290" height="6" rx="3" fill="#0d2b4e"/>
  <rect x="0" y="80" width="120" height="6" rx="3" fill="url(#ringGrad)" class="row-bar" style="animation-delay:0.7s"/>

  <text x="0" y="108" class="label">Profile Views</text>
  <text x="290" y="108" text-anchor="end" class="val">30+</text>
  <rect x="0" y="116" width="290" height="6" rx="3" fill="#0d2b4e"/>
  <rect x="0" y="116" width="90" height="6" rx="3" fill="url(#ringGrad)" class="row-bar" style="animation-delay:0.9s"/>
</g>
</svg>
