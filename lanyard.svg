<svg width="320" height="480" viewBox="0 0 320 480" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="strapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0891b2"/>
    <stop offset="100%" stop-color="#155e75"/>
  </linearGradient>
  <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0a1e3f"/>
    <stop offset="100%" stop-color="#04101f"/>
  </linearGradient>
  <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="badgeGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="cardClip">
    <rect x="-90" y="0" width="180" height="240" rx="16"/>
  </clipPath>
</defs>

<style>
  .swing { transform-origin: 160px 30px; animation: pendulum 3.2s ease-in-out infinite; }
  @keyframes pendulum {
    0%,100% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
  }
  .shine { animation: sweep 3.5s linear infinite; }
  @keyframes sweep { 0% { transform: translateX(-200px);} 100% { transform: translateX(200px);} }
  .drop { transform-origin: 160px 30px; animation: dropIn 1s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes dropIn { 0% { transform: translateY(-60px) rotate(0deg); opacity:0;} 100% { transform: translateY(0) rotate(0deg); opacity:1;} }
</style>

<circle cx="160" cy="16" r="8" fill="#0e7490"/>

<g class="drop">
<g class="swing">
  <!-- strap -->
  <path d="M160 20 L140 220 Q160 236 180 220 L160 20 Z" fill="url(#strapGrad)"/>
  <line x1="160" y1="20" x2="160" y2="220" stroke="#0e2f42" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- clip ring -->
  <rect x="150" y="212" width="20" height="14" rx="4" fill="#94a3b8"/>
  <circle cx="160" cy="234" r="10" fill="none" stroke="#94a3b8" stroke-width="4"/>

  <!-- card -->
  <g transform="translate(160,244)">
    <rect x="-90" y="0" width="180" height="240" rx="16" fill="url(#cardGrad)" stroke="#22d3ee" stroke-width="1.5"/>
    <g clip-path="url(#cardClip)">
      <rect class="shine" x="-90" y="0" width="60" height="240" fill="url(#shineGrad)" transform="skewX(-20)"/>
    </g>

    <text x="0" y="26" text-anchor="middle" font-family="Segoe UI, Arial" font-size="11" letter-spacing="2" fill="#64748b">EMPLOYEE ID</text>
    <line x1="-70" y1="34" x2="70" y2="34" stroke="#1e3a5f" stroke-width="1"/>

    <circle cx="0" cy="80" r="42" fill="#0d2b4e" stroke="#22d3ee" stroke-width="2" filter="url(#badgeGlow)"/>
    <circle cx="-13" cy="72" r="5" fill="#7dd3fc"/>
    <circle cx="13" cy="72" r="5" fill="#7dd3fc"/>
    <path d="M-16 92 Q0 106 16 92" stroke="#7dd3fc" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-42 80 a42 42 0 0 1 84 0" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>

    <text x="0" y="146" text-anchor="middle" font-family="Segoe UI, Arial" font-weight="700" font-size="18" fill="#e0f2fe">GOKUL G</text>
    <text x="0" y="166" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#22d3ee">AI Engineer &amp; Data Scientist</text>
    <text x="0" y="184" text-anchor="middle" font-family="Courier New, monospace" font-size="11" fill="#64748b">@GokulG-04</text>

    <!-- barcode -->
    <g transform="translate(-70,198)">
      <rect x="0" y="0" width="2" height="26" fill="#94a3b8"/>
      <rect x="4" y="0" width="1" height="26" fill="#94a3b8"/>
      <rect x="7" y="0" width="3" height="26" fill="#94a3b8"/>
      <rect x="12" y="0" width="1" height="26" fill="#94a3b8"/>
      <rect x="16" y="0" width="2" height="26" fill="#94a3b8"/>
      <rect x="20" y="0" width="1" height="26" fill="#94a3b8"/>
      <rect x="24" y="0" width="3" height="26" fill="#94a3b8"/>
      <rect x="29" y="0" width="1" height="26" fill="#94a3b8"/>
      <rect x="33" y="0" width="2" height="26" fill="#94a3b8"/>
      <rect x="38" y="0" width="1" height="26" fill="#94a3b8"/>
      <rect x="42" y="0" width="3" height="26" fill="#94a3b8"/>
      <rect x="47" y="0" width="1" height="26" fill="#94a3b8"/>
      <rect x="51" y="0" width="2" height="26" fill="#94a3b8"/>
      <rect x="55" y="0" width="1" height="26" fill="#94a3b8"/>
      <rect x="59" y="0" width="3" height="26" fill="#94a3b8"/>
      <rect x="64" y="0" width="1" height="26" fill="#94a3b8"/>
      <rect x="68" y="0" width="2" height="26" fill="#94a3b8"/>
      <rect x="72" y="0" width="1" height="26" fill="#94a3b8"/>
      <rect x="76" y="0" width="3" height="26" fill="#94a3b8"/>
      <rect x="81" y="0" width="2" height="26" fill="#94a3b8"/>
      <rect x="86" y="0" width="1" height="26" fill="#94a3b8"/>
      <rect x="90" y="0" width="2" height="26" fill="#94a3b8"/>
      <rect x="94" y="0" width="1" height="26" fill="#94a3b8"/>
    </g>
  </g>
</g>
</g>
</svg>
