<svg width="720" height="150" viewBox="0 0 720 150" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#22d3ee"/>
    <stop offset="100%" stop-color="#3b82f6"/>
  </linearGradient>
</defs>
<style>
  .cell { fill:#04101f; stroke:#0ea5e9; stroke-opacity:0.35; }
  .name { font-family:'Segoe UI', Arial; font-size:11px; fill:#93c5fd; }
  .rank { font-family:'Segoe UI', Arial; font-weight:700; font-size:18px; fill:#e0f2fe; }
  .pop { animation: popIn 0.6s cubic-bezier(.3,1.6,.4,1) both; transform-origin: center; }
  .shine-sweep { animation: sweepCell 3s linear infinite; }
  @keyframes sweepCell { 0%{transform:translateX(-30px);} 100%{transform:translateX(140px);} }
  @keyframes popIn { 0% { transform: scale(0); opacity:0;} 70% { transform: scale(1.1);} 100% { transform: scale(1); opacity:1;} }
</style>

<g transform="translate(10,10)">
  <!-- 5 trophy cells -->
  <g class="pop" style="animation-delay:0.1s">
    <rect x="0" y="0" width="130" height="130" rx="12" class="cell"/>
    <clipPath id="c1"><rect x="0" y="0" width="130" height="130" rx="12"/></clipPath>
    <g clip-path="url(#c1)"><rect class="shine-sweep" x="-30" y="0" width="20" height="130" fill="#22d3ee" opacity="0.12" transform="skewX(-20)"/></g>
    <path d="M65 30 l8 16 18 3 -13 13 3 18 -16 -9 -16 9 3 -18 -13 -13 18 -3 z" fill="url(#trophyGrad)"/>
    <text x="65" y="90" text-anchor="middle" class="name">Commits</text>
    <text x="65" y="110" text-anchor="middle" class="rank">S</text>
  </g>

  <g class="pop" style="animation-delay:0.25s" transform="translate(148,0)">
    <rect x="0" y="0" width="130" height="130" rx="12" class="cell"/>
    <clipPath id="c2"><rect x="0" y="0" width="130" height="130" rx="12"/></clipPath>
    <g clip-path="url(#c2)"><rect class="shine-sweep" x="-30" y="0" width="20" height="130" fill="#22d3ee" opacity="0.12" transform="skewX(-20)"/></g>
    <path d="M65 30 l8 16 18 3 -13 13 3 18 -16 -9 -16 9 3 -18 -13 -13 18 -3 z" fill="url(#trophyGrad)"/>
    <text x="65" y="90" text-anchor="middle" class="name">Pull Requests</text>
    <text x="65" y="110" text-anchor="middle" class="rank">A</text>
  </g>

  <g class="pop" style="animation-delay:0.4s" transform="translate(296,0)">
    <rect x="0" y="0" width="130" height="130" rx="12" class="cell"/>
    <clipPath id="c3"><rect x="0" y="0" width="130" height="130" rx="12"/></clipPath>
    <g clip-path="url(#c3)"><rect class="shine-sweep" x="-30" y="0" width="20" height="130" fill="#22d3ee" opacity="0.12" transform="skewX(-20)"/></g>
    <path d="M65 30 l8 16 18 3 -13 13 3 18 -16 -9 -16 9 3 -18 -13 -13 18 -3 z" fill="url(#trophyGrad)"/>
    <text x="65" y="90" text-anchor="middle" class="name">Repositories</text>
    <text x="65" y="110" text-anchor="middle" class="rank">A+</text>
  </g>

  <g class="pop" style="animation-delay:0.55s" transform="translate(444,0)">
    <rect x="0" y="0" width="130" height="130" rx="12" class="cell"/>
    <clipPath id="c4"><rect x="0" y="0" width="130" height="130" rx="12"/></clipPath>
    <g clip-path="url(#c4)"><rect class="shine-sweep" x="-30" y="0" width="20" height="130" fill="#22d3ee" opacity="0.12" transform="skewX(-20)"/></g>
    <path d="M65 30 l8 16 18 3 -13 13 3 18 -16 -9 -16 9 3 -18 -13 -13 18 -3 z" fill="url(#trophyGrad)"/>
    <text x="65" y="90" text-anchor="middle" class="name">Stars</text>
    <text x="65" y="110" text-anchor="middle" class="rank">B+</text>
  </g>

  <g class="pop" style="animation-delay:0.7s" transform="translate(592,0)">
    <rect x="0" y="0" width="130" height="130" rx="12" class="cell"/>
    <clipPath id="c5"><rect x="0" y="0" width="130" height="130" rx="12"/></clipPath>
    <g clip-path="url(#c5)"><rect class="shine-sweep" x="-30" y="0" width="20" height="130" fill="#22d3ee" opacity="0.12" transform="skewX(-20)"/></g>
    <path d="M65 30 l8 16 18 3 -13 13 3 18 -16 -9 -16 9 3 -18 -13 -13 18 -3 z" fill="url(#trophyGrad)"/>
    <text x="65" y="90" text-anchor="middle" class="name">Followers</text>
    <text x="65" y="110" text-anchor="middle" class="rank">C</text>
  </g>
</g>
</svg>
