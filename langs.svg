<svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="langGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#22d3ee"/>
    <stop offset="100%" stop-color="#3b82f6"/>
  </linearGradient>
</defs>
<style>
  .card-bg { fill:#04101f; stroke:#0ea5e9; stroke-opacity:0.35; }
  .title { font-family: 'Segoe UI', Arial; font-size:16px; font-weight:700; fill:#e0f2fe; }
  .label { font-family: 'Segoe UI', Arial; font-size:12px; fill:#93c5fd; }
  .val { font-family: 'Segoe UI', Arial; font-size:11px; fill:#22d3ee; }
  .bar { transform-origin: left; transform: scaleX(0); animation: barIn 1.4s ease-out forwards; }
  @keyframes barIn { to { transform: scaleX(1); } }
  .dot { animation: dotIn 0.5s ease-out forwards; opacity:0; }
  @keyframes dotIn { to { opacity:1; } }
</style>

<rect x="1" y="1" width="478" height="198" rx="12" class="card-bg"/>
<text x="24" y="34" class="title">Most Used Languages</text>

<g transform="translate(24,58)" font-family="Segoe UI, Arial">
  <circle cx="6" cy="0" r="5" fill="#3572A5" class="dot" style="animation-delay:0.1s"/>
  <text x="18" y="4" class="label">Python</text>
  <text x="432" y="4" text-anchor="end" class="val">42%</text>
  <rect x="0" y="12" width="432" height="7" rx="3.5" fill="#0d2b4e"/>
  <rect x="0" y="12" width="182" height="7" rx="3.5" fill="url(#langGrad)" class="bar" style="animation-delay:0.2s"/>

  <circle cx="6" cy="36" r="5" fill="#f1e05a" class="dot" style="animation-delay:0.3s"/>
  <text x="18" y="40" class="label">JavaScript</text>
  <text x="432" y="40" text-anchor="end" class="val">20%</text>
  <rect x="0" y="48" width="432" height="7" rx="3.5" fill="#0d2b4e"/>
  <rect x="0" y="48" width="86" height="7" rx="3.5" fill="url(#langGrad)" class="bar" style="animation-delay:0.4s"/>

  <circle cx="6" cy="72" r="5" fill="#e34c26" class="dot" style="animation-delay:0.5s"/>
  <text x="18" y="76" class="label">HTML/CSS</text>
  <text x="432" y="76" text-anchor="end" class="val">14%</text>
  <rect x="0" y="84" width="432" height="7" rx="3.5" fill="#0d2b4e"/>
  <rect x="0" y="84" width="60" height="7" rx="3.5" fill="url(#langGrad)" class="bar" style="animation-delay:0.6s"/>

  <circle cx="6" cy="108" r="5" fill="#b07219" class="dot" style="animation-delay:0.7s"/>
  <text x="18" y="112" class="label">Java</text>
  <text x="432" y="112" text-anchor="end" class="val">12%</text>
  <rect x="0" y="120" width="432" height="7" rx="3.5" fill="#0d2b4e"/>
  <rect x="0" y="120" width="52" height="7" rx="3.5" fill="url(#langGrad)" class="bar" style="animation-delay:0.8s"/>

  <circle cx="6" cy="144" r="5" fill="#00758f" class="dot" style="animation-delay:0.9s"/>
  <text x="18" y="148" class="label">SQL</text>
  <text x="432" y="148" text-anchor="end" class="val">12%</text>
  <rect x="0" y="156" width="432" height="7" rx="3.5" fill="#0d2b4e"/>
  <rect x="0" y="156" width="52" height="7" rx="3.5" fill="url(#langGrad)" class="bar" style="animation-delay:1.0s"/>
</g>
</svg>
